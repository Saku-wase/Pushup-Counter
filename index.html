<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>腕立て伏せカウンター</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22lg%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%232b7cff%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%2300e676%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20fill%3D%22%23ff5a1f%22/%3E%3Cg%20stroke%3D%22%230e1116%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M6%2024H26%22%20opacity%3D%22.45%22/%3E%3Cpath%20d%3D%22M8%2022.5L21%2016%22/%3E%3Cpath%20d%3D%22M20.2%2016.4V22.8%22/%3E%3C/g%3E%3Ccircle%20cx%3D%2224.4%22%20cy%3D%2214.4%22%20r%3D%222.5%22%20fill%3D%22%230e1116%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@1,700;1,800;1,900&family=Dela+Gothic+One&family=M+PLUS+1:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --line: #2c2c2c;
    --text: #f2efe8;
    --sub: #8c8a85;
    --accent: #ff5a1f;
    --blue: #f2efe8;
    --radius: 0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at top, #1a2130, var(--bg) 60%);
    color: var(--text);
    font-family: "M PLUS 1", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 720px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

  header { display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 19px; margin: 0; letter-spacing: .04em; display: flex; align-items: center; gap: 10px; font-weight: 700; }
  header h1 b { background: linear-gradient(90deg, var(--blue), var(--accent)); -webkit-background-clip: text;
                background-clip: text; color: transparent; }
  .logo { width: 32px; height: 32px; flex: none; filter: drop-shadow(0 4px 12px rgba(255,90,31,.25)); }
  #status { font-size: 12px; color: var(--sub); background: var(--card); border: 1px solid var(--line);
            padding: 4px 10px; border-radius: 999px; }

  /* カメラ映像と回数 */
  #wrap { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000;
          border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mirror { transform: scaleX(-1); }
  .count-badge {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
    border-radius: 14px; padding: 6px 18px 10px; text-align: center;
  }
  .count-badge small { display: block; font-size: 11px; color: var(--sub); letter-spacing: .1em; }
  #count { font-size: 64px; font-weight: 800; line-height: 1; color: var(--accent);
           font-variant-numeric: tabular-nums; transition: transform .15s; }
  #count.pop { transform: scale(1.25); }
  .placeholder { position: absolute; inset: 0; display: grid; place-items: center;
                 color: var(--sub); font-size: 14px; }

  /* 状態表示 */
  #detail { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
            padding: 10px 14px; font-size: 14px; text-align: center; font-variant-numeric: tabular-nums; }

  /* ボタン */
  .controls { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
  button { font: inherit; font-size: 15px; font-weight: 600; padding: 14px 8px; border-radius: 12px;
           border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer;
           transition: transform .1s, filter .2s; }
  button:active { transform: scale(.97); }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button:hover { filter: brightness(1.15); }

  /* 詳細設定 */
  details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  summary { cursor: pointer; color: var(--sub); font-size: 14px; }
  .setting { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--sub); }
  .setting input { flex: 1; accent-color: var(--accent); }
  #info { margin-top: 10px; font-size: 13px; color: #ffd600; }

  /* ===== キネティック・モーション ===== */
  :root { --spring: cubic-bezier(.34, 1.56, .64, 1); --depth: 0; }

  /* 背景がゆっくり動く */
  body { background-size: 160% 160%; animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { from { background-position: 50% 0%; } to { background-position: 50% 40%; } }

  /* 画面要素が順番にせり上がって登場 */
  .app > * { opacity: 0; transform: translateY(18px); animation: rise .7s var(--spring) forwards; }
  .app > *:nth-child(2) { animation-delay: .08s; }
  .app > *:nth-child(3) { animation-delay: .16s; }
  .app > *:nth-child(4) { animation-delay: .24s; }
  .app > *:nth-child(5) { animation-delay: .32s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* 回数：下から跳ね上がって切り替わる */
  #count.pop { transform: none; animation: bump .5s var(--spring); }
  @keyframes bump {
    0%   { transform: translateY(40%) scale(.6); opacity: 0; }
    60%  { transform: translateY(-8%) scale(1.25); opacity: 1;  }
    100% { transform: none; }
  }
  /* 回数バッジから光の輪が広がる */
  .count-badge::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    border: 2px solid var(--accent); opacity: 0; pointer-events: none;
  }
  .count-badge.burst::after { animation: ring .6s ease-out; }
  @keyframes ring { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.8); } }

  /* 深さゲージ：肘を曲げるほど満ちていく */
  .gauge {
    position: absolute; right: 12px; top: 12px; bottom: 12px; width: 14px; z-index: 2;
    background: rgba(0,0,0,.5); border-radius: 999px; overflow: hidden;
  }
  .gauge-fill {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: calc(var(--depth) * 100%);
    background: linear-gradient(to top, var(--blue), var(--accent));
    border-radius: inherit; transition: height .12s linear;
  }
  .gauge.full .gauge-fill { animation: flash .4s ease-out; }
  @keyframes flash { 50% { filter: brightness(1.8); box-shadow: 0 0 16px var(--accent); } }

  /* 状態に応じて枠の色がなめらかに変わる */
  #detail { transition: border-color .3s, box-shadow .3s, transform .3s var(--spring); }
  #detail[data-stage="down"] { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(242,239,232,.2); transform: translateY(2px); }
  #detail[data-stage="up"] { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,90,31,.15); }

  /* 認識中は呼吸するように光る点 */
  #status::before {
    content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px;
    border-radius: 50%; background: var(--sub); vertical-align: 1px;
  }
  #status.live { color: var(--accent); }
  #status.live::before { background: var(--accent); animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 5px rgba(255,90,31,0); opacity: .4; } }

  /* ボタン：ばねのような押し心地 */
  button { transition: transform .35s var(--spring), filter .2s, box-shadow .3s; }
  button:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  button:active { transform: scale(.94); transition-duration: .08s; }

  /* 動きを減らす設定の端末ではアニメーションを止める */
  /* ===== 腕立て1回ごとのエフェクト ===== */
  #fx { pointer-events: none; z-index: 3; }
  .sweep {
    position: absolute; inset: 0; z-index: 3; pointer-events: none; transform: translateX(-120%);
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.08) 45%,
                rgba(255,90,31,.45) 50%, rgba(255,255,255,.08) 55%, transparent 62%);
  }
  .sweep.go { animation: sweep .65s cubic-bezier(.4,0,.2,1); }
  .sweep.gold { background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.1) 45%,
                rgba(255,213,79,.6) 50%, rgba(255,255,255,.1) 55%, transparent 62%); }
  @keyframes sweep { to { transform: translateX(120%); } }

  .rep-pop {
    position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; pointer-events: none;
    font-size: clamp(96px, 30vw, 210px); font-weight: 900; font-style: italic; letter-spacing: -.05em;
    color: transparent; -webkit-text-stroke: 3px var(--accent); opacity: 0;
  }
  .rep-pop.gold { -webkit-text-stroke-color: #ffd54f; --glow: #ffd54f; }
  .rep-pop.go { animation: repPop .85s cubic-bezier(.2,.8,.2,1); }
  @keyframes repPop {
    0%   { opacity: 0; transform: scale(2.4) skewX(-14deg); filter: blur(10px); }
    22%  { opacity: 1; transform: scale(1) skewX(-14deg); filter: blur(0);
            }
    70%  { opacity: .9; transform: scale(1.04) skewX(-14deg); }
    100% { opacity: 0; transform: scale(.92) translateY(-34px) skewX(-14deg); }
  }
  .rep-sub { position: absolute; bottom: 18%; left: 0; right: 0; z-index: 4; text-align: center;
             font-weight: 800; letter-spacing: .4em; font-size: 14px; color: #ffd54f; opacity: 0; pointer-events: none; }
  .rep-sub.go { animation: sub 1.2s ease-out; }
  @keyframes sub { 15%, 70% { opacity: 1; letter-spacing: .6em; } 100% { opacity: 0; letter-spacing: .9em; } }

  #wrap.hit { animation: hit .45s ease-out, shake .4s linear; }
  @keyframes shake { 10% { transform: translate(-6px, 3px); } 25% { transform: translate(5px, -4px); }
                     40% { transform: translate(-4px, -2px); } 60% { transform: translate(3px, 3px); }
                     80% { transform: translate(-1px, -1px); } 100% { transform: none; } }
  @keyframes hit { 0% { box-shadow: inset 0 0 0 0 rgba(255,90,31,0); }
                   30% { box-shadow: inset 0 0 0 4px rgba(255,90,31,.9), inset 0 0 60px rgba(255,90,31,.35); }
                   100% { box-shadow: inset 0 0 0 0 rgba(255,90,31,0); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .app > * { opacity: 1; transform: none; }
  }

  /* ===== フォント ===== */
  :root { --num: "Saira Condensed", "M PLUS 1", sans-serif; --head: "Dela Gothic One", "M PLUS 1", sans-serif; }
  header h1 { font-weight: 800; letter-spacing: .02em; }
  .count-badge small { font-family: var(--num); font-size: 14px; letter-spacing: .3em; }
  #count { font-family: var(--num); font-weight: 400; font-size: 84px; letter-spacing: .02em; }
  .rep-pop { font-family: var(--num); font-weight: 400; font-size: clamp(130px, 40vw, 280px); letter-spacing: 0; }
  .rep-sub { font-family: var(--num); font-weight: 400; font-size: 26px; }
  button { font-weight: 800; letter-spacing: .08em; }
  #status { font-weight: 600; letter-spacing: .05em; }

  /* ===== スポーツ広告風：グラデーション・光・角丸をやめ、黒×オフホワイト×オレンジ1色 ===== */
  .app *, .app *::before, .app *::after { border-radius: 0 !important; }
  body { background: var(--bg); animation: none; }
  header { border-bottom: 4px solid var(--accent); padding-bottom: 10px; }
  header h1 span { display: block; line-height: 1.2; }
  header h1 em { display: block; }
  header h1 b { background: none; color: var(--accent); }
  header h1 em { font-family: var(--num); font-style: normal; font-weight: 400; font-size: 13px;
                 letter-spacing: .35em; color: var(--sub); }
  .logo { filter: none; }
  #status { border: 1.5px solid var(--line); }
  #wrap { border: 2px solid var(--text); }
  .count-badge { background: var(--bg); backdrop-filter: none; border-left: 6px solid var(--accent);
                 top: 0; left: 0; padding: 8px 18px 6px 14px; text-align: left; }
  .gauge { background: rgba(10,10,10,.75); top: 0; bottom: 0; right: 0; width: 10px; }
  .gauge-fill { background: var(--accent); }
  #detail { border: 1.5px solid var(--line); }
  button { border: 2px solid var(--text); background: transparent; text-transform: uppercase; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0a0a0a; }
  button:hover { box-shadow: 4px 4px 0 var(--accent); transform: translate(-2px, -2px); filter: none; }
  button.primary:hover { box-shadow: 4px 4px 0 var(--text); }
  details { border: 1.5px solid var(--line); }
  #info { color: var(--sub); }
  .sweep { background: linear-gradient(115deg, transparent 44%, var(--accent) 44%, var(--accent) 52%, transparent 52%); opacity: .55; }
  .sweep.gold { background: linear-gradient(115deg, transparent 40%, #f2efe8 40%, #f2efe8 54%, transparent 54%); }
  .rep-pop.gold { -webkit-text-stroke-color: #f2efe8; }
  .rep-sub { color: var(--accent); }

  /* ===== スポーツ系フォント：数字・英字は斜体のコンデンス、日本語見出しは極太ゴシックを斜めに ===== */
  #count, .rep-pop, .rep-sub, .count-badge small, header h1 em { font-style: italic; font-weight: 900; }
  #count { font-size: 80px; letter-spacing: -.01em; }
  .rep-pop { font-weight: 900; letter-spacing: -.03em; }
  header h1 { font-family: var(--head); font-weight: 400; font-size: 21px; }
  header h1 > span > :not(em), header h1 > span { font-style: normal; }
  header h1 span { transform: skewX(-9deg); transform-origin: left bottom; }
  header h1 em { font-size: 14px; letter-spacing: .28em; }
  button { font-family: var(--head); font-weight: 400; letter-spacing: .06em; }
  button > * , button { font-style: normal; }
  #detail { font-family: var(--num), "M PLUS 1", sans-serif; font-style: italic; font-weight: 700; font-size: 16px; letter-spacing: .03em; }

  /* ===== カメラを画面いっぱいに大きく（体が切れないよう全体を収める） ===== */
  .app { max-width: 1280px; }
  #wrap { aspect-ratio: auto; height: calc(100svh - 250px); min-height: 300px; }
  video, canvas { object-fit: contain; }
  @media (min-width: 900px) { #wrap { height: calc(100svh - 230px); } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b7cff"/><stop offset="1" stop-color="#ff5a1f"/></linearGradient></defs><rect width="32" height="32" fill="#ff5a1f"/><g stroke="#0e1116" stroke-width="2.6" stroke-linecap="round" fill="none"><path d="M6 24H26" opacity=".45"/><path d="M8 22.5L21 16"/><path d="M20.2 16.4V22.8"/></g><circle cx="24.4" cy="14.4" r="2.5" fill="#0e1116"/></svg><span>腕立て伏せ<b>カウンター</b><em>PUSH-UP COUNTER</em></span></h1>
    <span id="status">待機中</span>
  </header>

  <div id="wrap">
    <div class="placeholder">「カメラ開始」を押してください</div>
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <canvas id="fx"></canvas>
    <div class="sweep"></div>
    <div class="rep-pop"></div>
    <div class="rep-sub"></div>
    <div class="gauge"><div class="gauge-fill"></div></div>
    <div class="count-badge"><small>REPS</small><div id="count">0</div></div>
  </div>

  <div id="detail">肘: --° ／ 状態: -- ／ 体: --</div>

  <div class="controls">
    <button id="start" class="primary">カメラ開始</button>
    <button id="flip">切替</button>
    <button id="reset">リセット</button>
  </div>

  <details>
    <summary>詳細設定</summary>
    <div class="setting">なめらか <input type="range" id="smooth" min="0.5" max="8" step="0.5" value="7"> 反応速い <span id="smoothVal">7</span></div>
    <div id="info">首の角度: -- ／ 使用する腕: --</div>
  </details>
</div>

<script>
  window.addEventListener("error", e => document.getElementById("status").textContent = "エラー: " + e.message);
  window.addEventListener("unhandledrejection", e => document.getElementById("status").textContent = "エラー: " + e.reason);
</script>
<script type="module">
import { PoseLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ===== 設定 =====
const CONF = 0.65;   // ③ 検出・追跡の信頼度しきい値
const VIS = 0.6;     // ④ この値未満の点は「見えていない」として使わない

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");
const info = document.getElementById("info");

// 顔(0〜10)を除いた体の接続
const BODY = PoseLandmarker.POSE_CONNECTIONS.filter(c => c.start > 10 && c.end > 10);
const LEFT_ARM = [11, 13, 15], RIGHT_ARM = [12, 14, 16];

// ===== ② One Euroフィルター（止まっている時は強く、動く時は弱く平滑化）=====
class OneEuro {
  constructor(minCutoff = 2.5, beta = 10, dCutoff = 1.0) {
    Object.assign(this, { minCutoff, beta, dCutoff, x: null, dx: 0, t: null });
  }
  alpha(cutoff, dt) { const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
  filter(v, t) {
    if (this.x === null) { this.x = v; this.t = t; return v; }
    const dt = Math.max((t - this.t) / 1000, 1e-3); this.t = t;
    const dx = (v - this.x) / dt;
    this.dx += this.alpha(this.dCutoff, dt) * (dx - this.dx);
    const cutoff = minCutoffUI + this.beta * Math.abs(this.dx);
    this.x += this.alpha(cutoff, dt) * (v - this.x);
    return this.x;
  }
}
// スライダーで調整：値が大きいほど反応が速く、小さいほどなめらか
let minCutoffUI = 7;
const slider = document.getElementById("smooth");
slider.oninput = () => { minCutoffUI = +slider.value; document.getElementById("smoothVal").textContent = slider.value; };
let filters = null;
const resetFilters = () => filters = Array.from({ length: 33 }, () => ({ x: new OneEuro(), y: new OneEuro() }));
function smooth(lm, t) {
  if (!filters) resetFilters();
  return lm.map((p, i) => ({ x: filters[i].x.filter(p.x, t), y: filters[i].y.filter(p.y, t), visibility: p.visibility }));
}

let landmarker, stream, facing = "user", lastTime = -1, running = false;

async function loadModel() {
  status.textContent = "AIモデル読み込み中…";
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = d => ({
    baseOptions: {
      // ① Lite → Full モデル
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
      delegate: d
    },
    runningMode: "VIDEO",
    numPoses: 1,
    minPoseDetectionConfidence: CONF,
    minPosePresenceConfidence: CONF,
    minTrackingConfidence: CONF
  });
  try { landmarker = await PoseLandmarker.createFromOptions(vision, opts("GPU")); }
  catch { landmarker = await PoseLandmarker.createFromOptions(vision, opts("CPU")); }
}

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: 640, height: 480 }, audio: false });  // ⑤ 640×480
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  fx.width = canvas.width; fx.height = canvas.height;
  const m = facing === "user";
  video.classList.toggle("mirror", m);
  canvas.classList.toggle("mirror", m);
}

// ===== 描画 =====
const px = p => ({ x: p.x * canvas.width, y: p.y * canvas.height });
const ok = p => (p.visibility ?? 1) >= VIS;

function line(a, b, color, w) {
  ctx.strokeStyle = color; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
}
function dot(p, color, r) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
}

// ④ 左右の腕のうち、よく見えている方を選ぶ
function pickArm(lm) {
  const score = ids => ids.reduce((s, i) => s + (lm[i].visibility ?? 0), 0) / ids.length;
  const l = score(LEFT_ARM), r = score(RIGHT_ARM);
  const best = l >= r ? { ids: LEFT_ARM, name: "左", s: l } : { ids: RIGHT_ARM, name: "右", s: r };
  return best.s >= VIS ? best : null;
}

function drawPose(lm) {
  // 見えている点同士だけ線で結ぶ
  for (const c of BODY) {
    if (ok(lm[c.start]) && ok(lm[c.end])) line(px(lm[c.start]), px(lm[c.end]), "#f2efe8", 4);
  }
  for (let i = 11; i < 33; i++) if (ok(lm[i])) dot(px(lm[i]), "#ff5a1f", 4);

  // カウントに使う腕を緑で強調
  const arm = pickArm(lm);
  // エフェクトの発生位置（肩）。前面カメラは映像が左右反転しているので合わせる
  if (arm) { const sp = lm[arm.ids[0]]; anchor = { x: facing === "user" ? 1 - sp.x : sp.x, y: sp.y }; }
  if (arm) {
    const [s, e, w] = arm.ids.map(i => px(lm[i]));
    line(s, e, "#ff5a1f", 7); line(e, w, "#ff5a1f", 7);
  }
  if (arm) {
    const [s, e, w] = arm.ids.map(i => px(lm[i]));
    updateCount(angleAt(s, e, w), isHorizontal(lm));
  }
  const neck = drawNeck(lm);
  info.textContent = `首の角度: ${neck ?? "--"}${neck != null ? "°" : ""} ／ 使用する腕: ${arm ? arm.name : "見えていません"}`;
}

const mid = (a, b) => ({ x: (a.x + b.x) / 2 * canvas.width, y: (a.y + b.y) / 2 * canvas.height });
function drawNeck(lm) {
  const need = [7, 8, 11, 12, 23, 24];
  // 耳・肩・腰は左右どちらか見えていればOK
  if (!(ok(lm[7]) || ok(lm[8])) || !(ok(lm[11]) || ok(lm[12])) || !(ok(lm[23]) || ok(lm[24]))) return null;
  const sh = mid(lm[11], lm[12]), hip = mid(lm[23], lm[24]), head = mid(lm[7], lm[8]);
  line(sh, head, "#8c8a85", 5); dot(head, "#8c8a85", 7);
  const a1 = Math.atan2(sh.y - hip.y, sh.x - hip.x);
  const a2 = Math.atan2(head.y - sh.y, head.x - sh.x);
  let deg = Math.abs((a2 - a1) * 180 / Math.PI);
  if (deg > 180) deg = 360 - deg;
  return deg.toFixed(0);
}

// ===== 回数カウント =====
const DOWN = 90, UP = 160;   // 肘の角度のしきい値
const HOLD = 2;              // 何フレーム続いたら状態を確定するか（ブレ対策）
const MIN_GAP = 400;         // 1回の最短時間(ms)。速すぎる誤カウントを防ぐ
let count = 0, stage = null, holdDown = 0, holdUp = 0, lastRep = 0;
const countEl = document.getElementById("count");
const detailEl = document.getElementById("detail");

// 3点 a-b-c の b での角度
function angleAt(a, b, c) {
  const r = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
  let d = Math.abs(r * 180 / Math.PI);
  return d > 180 ? 360 - d : d;
}

// 体（腰→肩）が水平に近いか。立ったまま腕を曲げても数えない
function isHorizontal(lm) {
  if (!(ok(lm[11]) || ok(lm[12])) || !(ok(lm[23]) || ok(lm[24]))) return false;
  const sh = mid(lm[11], lm[12]), hip = mid(lm[23], lm[24]);
  let a = Math.abs(Math.atan2(sh.y - hip.y, sh.x - hip.x) * 180 / Math.PI);
  return Math.min(a, 180 - a) < 40;
}

function updateCount(angle, horiz) {
  holdDown = angle <= DOWN ? holdDown + 1 : 0;
  holdUp = angle >= UP ? holdUp + 1 : 0;

  if (holdUp >= HOLD) {
    if (stage === "down" && performance.now() - lastRep > MIN_GAP) {
      count++; lastRep = performance.now();
      countEl.textContent = count;
      kick(countEl, "pop"); kick(document.querySelector(".count-badge"), "burst");
      celebrate(count);
      speak(count);
    }
    stage = "up";
  } else if (holdDown >= HOLD && stage === "up" && horiz) {
    stage = "down";
  }
  // 深さゲージ：160°で0、90°で満タン
  const depth = Math.min(1, Math.max(0, (UP - angle) / (UP - DOWN)));
  document.documentElement.style.setProperty("--depth", depth.toFixed(3));
  const gauge = document.querySelector(".gauge");
  if (depth >= 1 && !gauge.classList.contains("full")) kick(gauge, "full");
  if (depth < 1) gauge.classList.remove("full");
  detailEl.dataset.stage = stage ?? "";
  detailEl.textContent = `肘: ${angle.toFixed(0)}° ／ 状態: ${stage === "down" ? "下" : stage === "up" ? "上" : "待機"} ／ 体: ${horiz ? "水平 ✅" : "水平でない"}`;
}

// ===== 腕立て1回ごとのエフェクト =====
const fx = document.getElementById("fx");
const fctx = fx.getContext("2d");
const wrapEl = document.getElementById("wrap");
const sweepEl = document.querySelector(".sweep");
const popEl = document.querySelector(".rep-pop");
const subEl = document.querySelector(".rep-sub");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let anchor = { x: .5, y: .5 }, sparks = [], fxRunning = false;

function celebrate(n) {
  const gold = n % 10 === 0;   // 10回ごとは金色の特別演出
  popEl.textContent = n;
  popEl.classList.toggle("gold", gold);
  sweepEl.classList.toggle("gold", gold);
  kick(popEl, "go"); kick(sweepEl, "go"); kick(wrapEl, "hit");
  if (gold) { subEl.textContent = `${n} REPS`; kick(subEl, "go"); }
  if (!reduceMotion) burst(anchor, gold);
}

// 肩の位置で爆発：閃光 → 衝撃波 → 火の粉・光の筋 → 煙
let booms = [], smoke = [];
function burst(p, gold) {
  const x = p.x * fx.width, y = p.y * fx.height;
  const k = gold ? 1.6 : 1;   // 10回ごとは規模を大きく
  booms.push({ x, y, t: 0, r: 90 * k, gold });
  const colors = gold ? ["#f2efe8", "#ffffff", "#ff5a1f"] : ["#ff5a1f", "#ffb08f", "#f2efe8"];
  const n = Math.round(26 * k);
  for (let i = 0; i < n; i++) {           // 光の筋
    const a = Math.PI * 2 * i / n + Math.random() * .3, sp = 6 + Math.random() * 8 * k;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: .025 + Math.random() * .02,
                  c: colors[i % colors.length], g: 0, line: true });
  }
  for (let i = 0; i < 30 * k; i++) {      // 火の粉（重力で落ちる）
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 9 * k;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3, life: 1, decay: .012 + Math.random() * .02,
                  c: Math.random() < .5 ? "#ff9100" : "#ffea00", g: .28, line: false });
  }
  for (let i = 0; i < 10 * k; i++) {      // 煙
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 2.5;
    smoke.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - .8, r: 10 + Math.random() * 14, life: 1 });
  }
  if (!fxRunning) { fxRunning = true; requestAnimationFrame(drawSparks); }
}

function drawSparks() {
  fctx.clearRect(0, 0, fx.width, fx.height);

  // 煙（普通に重ねる）
  fctx.globalCompositeOperation = "source-over";
  for (const m of smoke) {
    fctx.globalAlpha = m.life * .35;
    fctx.fillStyle = "#9aa3ad";
    fctx.beginPath(); fctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); fctx.fill();
    m.x += m.vx; m.y += m.vy; m.vx *= .96; m.vy = m.vy * .96 - .05; m.r += .9; m.life -= .018;
  }

  // ここから下は光なので加算合成
  fctx.globalCompositeOperation = "lighter";
  for (const b of booms) {
    const t = b.t;
    // 閃光：中心が白く、外側がオレンジの火の玉が膨らんで消える
    const fr = b.r * Math.min(1, t / 8) * (1 + t / 40);
    const fa = Math.max(0, 1 - t / 22);
    if (fa > 0) {
      const g = fctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, fr);
      g.addColorStop(0, `rgba(255,255,255,${fa})`);
      g.addColorStop(.35, b.gold ? `rgba(242,239,232,${fa})` : `rgba(255,170,60,${fa})`);
      g.addColorStop(1, "rgba(255,80,0,0)");
      fctx.globalAlpha = 1; fctx.fillStyle = g;
      fctx.beginPath(); fctx.arc(b.x, b.y, fr, 0, Math.PI * 2); fctx.fill();
    }
    // 衝撃波：細くなりながら広がるリング
    const sa = Math.max(0, 1 - t / 26);
    if (sa > 0) {
      fctx.globalAlpha = sa;
      fctx.strokeStyle = b.gold ? "#ff5a1f" : "#f2efe8";
      fctx.lineWidth = 8 * sa + .5;
      fctx.beginPath(); fctx.arc(b.x, b.y, b.r * .4 + t * 9, 0, Math.PI * 2); fctx.stroke();
    }
    b.t++;
  }
  booms = booms.filter(b => b.t < 30);

  fctx.lineCap = "round";
  for (const s of sparks) {
    fctx.globalAlpha = s.life;
    if (s.line) {
      fctx.strokeStyle = s.c; fctx.lineWidth = 3 * s.life + .5;
      fctx.beginPath(); fctx.moveTo(s.x - s.vx * 3, s.y - s.vy * 3); fctx.lineTo(s.x, s.y); fctx.stroke();
      s.vx *= .92; s.vy *= .92;
    } else {
      fctx.fillStyle = s.c;
      fctx.beginPath(); fctx.arc(s.x, s.y, 1.5 + 2 * s.life * Math.random(), 0, Math.PI * 2); fctx.fill();   // ちらつく火の粉
      s.vx *= .97; s.vy = s.vy * .97 + s.g;
    }
    s.x += s.vx; s.y += s.vy; s.life -= s.decay;
  }
  sparks = sparks.filter(s => s.life > 0);
  smoke = smoke.filter(m => m.life > 0);
  fctx.globalAlpha = 1; fctx.globalCompositeOperation = "source-over";

  if (sparks.length || booms.length || smoke.length) requestAnimationFrame(drawSparks);
  else { fxRunning = false; fctx.clearRect(0, 0, fx.width, fx.height); }
}

// アニメーション用クラスを付け直して毎回再生させる
function kick(el, cls) {
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
}

function speak(n) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(n));
  u.lang = "ja-JP";
  speechSynthesis.speak(u);
}

document.getElementById("reset").onclick = () => {
  count = 0; stage = null; countEl.textContent = 0;
};

function loop() {
  if (video.currentTime !== lastTime) {
    lastTime = video.currentTime;
    const t = performance.now();
    const result = landmarker.detectForVideo(video, t);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (result.landmarks.length) {
      drawPose(smooth(result.landmarks[0], t));
      status.textContent = "認識中"; status.classList.add("live");
    } else {
      filters = null;   // 見失ったらフィルターをリセット
      status.textContent = "人が映っていません"; status.classList.remove("live");
      info.textContent = "首の角度: -- ／ 使用する腕: --";
    }
  }
  requestAnimationFrame(loop);
}

document.getElementById("start").onclick = async () => {
  try {
    if (!navigator.mediaDevices) throw new Error("カメラが使えない環境です（https か localhost で開いてください）");
    status.textContent = "カメラ起動中…";
    await startCamera();
    document.querySelector(".placeholder")?.remove();
    if (!landmarker) await loadModel();
    if (!running) { running = true; loop(); }
  } catch (e) {
    status.textContent = "エラー: " + e.message;
  }
};

document.getElementById("flip").onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  if (stream) { filters = null; await startCamera(); }
};
</script>
