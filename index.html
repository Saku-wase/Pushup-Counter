<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>腕立て伏せカウンター</title>
<style>
  :root {
    --bg: #0e1116;
    --card: #171b22;
    --line: #262c36;
    --text: #e8ecf1;
    --sub: #8a94a3;
    --accent: #00e676;
    --blue: #2b7cff;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at top, #1a2130, var(--bg) 60%);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 720px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

  header { display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .05em; }
  #status { font-size: 12px; color: var(--sub); background: var(--card); border: 1px solid var(--line);
            padding: 4px 10px; border-radius: 999px; }

  /* カメラ映像と回数 */
  #wrap { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000;
          border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mirror { transform: scaleX(-1); }
  .count-badge {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
    border-radius: 14px; padding: 6px 18px 10px; text-align: center;
  }
  .count-badge small { display: block; font-size: 11px; color: var(--sub); letter-spacing: .1em; }
  #count { font-size: 64px; font-weight: 800; line-height: 1; color: var(--accent);
           font-variant-numeric: tabular-nums; transition: transform .15s; }
  #count.pop { transform: scale(1.25); }
  .placeholder { position: absolute; inset: 0; display: grid; place-items: center;
                 color: var(--sub); font-size: 14px; }

  /* 状態表示 */
  #detail { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
            padding: 10px 14px; font-size: 14px; text-align: center; font-variant-numeric: tabular-nums; }

  /* ボタン */
  .controls { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
  button { font: inherit; font-size: 15px; font-weight: 600; padding: 14px 8px; border-radius: 12px;
           border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer;
           transition: transform .1s, filter .2s; }
  button:active { transform: scale(.97); }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button:hover { filter: brightness(1.15); }

  /* 詳細設定 */
  details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  summary { cursor: pointer; color: var(--sub); font-size: 14px; }
  .setting { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--sub); }
  .setting input { flex: 1; accent-color: var(--accent); }
  #info { margin-top: 10px; font-size: 13px; color: #ffd600; }

  /* ===== キネティック・モーション ===== */
  :root { --spring: cubic-bezier(.34, 1.56, .64, 1); --depth: 0; }

  /* 背景がゆっくり動く */
  body { background-size: 160% 160%; animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { from { background-position: 50% 0%; } to { background-position: 50% 40%; } }

  /* 画面要素が順番にせり上がって登場 */
  .app > * { opacity: 0; transform: translateY(18px); animation: rise .7s var(--spring) forwards; }
  .app > *:nth-child(2) { animation-delay: .08s; }
  .app > *:nth-child(3) { animation-delay: .16s; }
  .app > *:nth-child(4) { animation-delay: .24s; }
  .app > *:nth-child(5) { animation-delay: .32s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* 回数：下から跳ね上がって切り替わる */
  #count.pop { transform: none; animation: bump .5s var(--spring); }
  @keyframes bump {
    0%   { transform: translateY(40%) scale(.6); opacity: 0; }
    60%  { transform: translateY(-8%) scale(1.25); opacity: 1; text-shadow: 0 0 24px var(--accent); }
    100% { transform: none; }
  }
  /* 回数バッジから光の輪が広がる */
  .count-badge::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    border: 2px solid var(--accent); opacity: 0; pointer-events: none;
  }
  .count-badge.burst::after { animation: ring .6s ease-out; }
  @keyframes ring { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.8); } }

  /* 深さゲージ：肘を曲げるほど満ちていく */
  .gauge {
    position: absolute; right: 12px; top: 12px; bottom: 12px; width: 14px; z-index: 2;
    background: rgba(0,0,0,.5); border-radius: 999px; overflow: hidden;
  }
  .gauge-fill {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: calc(var(--depth) * 100%);
    background: linear-gradient(to top, var(--blue), var(--accent));
    border-radius: inherit; transition: height .12s linear;
  }
  .gauge.full .gauge-fill { animation: flash .4s ease-out; }
  @keyframes flash { 50% { filter: brightness(1.8); box-shadow: 0 0 16px var(--accent); } }

  /* 状態に応じて枠の色がなめらかに変わる */
  #detail { transition: border-color .3s, box-shadow .3s, transform .3s var(--spring); }
  #detail[data-stage="down"] { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(43,124,255,.2); transform: translateY(2px); }
  #detail[data-stage="up"] { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,230,118,.15); }

  /* 認識中は呼吸するように光る点 */
  #status::before {
    content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px;
    border-radius: 50%; background: var(--sub); vertical-align: 1px;
  }
  #status.live { color: var(--accent); }
  #status.live::before { background: var(--accent); animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 5px rgba(0,230,118,0); opacity: .4; } }

  /* ボタン：ばねのような押し心地 */
  button { transition: transform .35s var(--spring), filter .2s, box-shadow .3s; }
  button:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  button:active { transform: scale(.94); transition-duration: .08s; }

  /* 動きを減らす設定の端末ではアニメーションを止める */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .app > * { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>💪 腕立て伏せカウンター</h1>
    <span id="status">待機中</span>
  </header>

  <div id="wrap">
    <div class="placeholder">「カメラ開始」を押してください</div>
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="gauge"><div class="gauge-fill"></div></div>
    <div class="count-badge"><small>回数</small><div id="count">0</div></div>
  </div>

  <div id="detail">肘: --° ／ 状態: -- ／ 体: --</div>

  <div class="controls">
    <button id="start" class="primary">カメラ開始</button>
    <button id="flip">切替</button>
    <button id="reset">リセット</button>
  </div>

  <details>
    <summary>詳細設定</summary>
    <div class="setting">なめらか <input type="range" id="smooth" min="0.5" max="8" step="0.5" value="7"> 反応速い <span id="smoothVal">7</span></div>
    <div id="info">首の角度: -- ／ 使用する腕: --</div>
  </details>
</div>

<script>
  window.addEventListener("error", e => document.getElementById("status").textContent = "エラー: " + e.message);
  window.addEventListener("unhandledrejection", e => document.getElementById("status").textContent = "エラー: " + e.reason);
</script>
<script type="module">
import { PoseLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ===== 設定 =====
const CONF = 0.65;   // ③ 検出・追跡の信頼度しきい値
const VIS = 0.6;     // ④ この値未満の点は「見えていない」として使わない

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");
const info = document.getElementById("info");

// 顔(0〜10)を除いた体の接続
const BODY = PoseLandmarker.POSE_CONNECTIONS.filter(c => c.start > 10 && c.end > 10);
const LEFT_ARM = [11, 13, 15], RIGHT_ARM = [12, 14, 16];

// ===== ② One Euroフィルター（止まっている時は強く、動く時は弱く平滑化）=====
class OneEuro {
  constructor(minCutoff = 2.5, beta = 10, dCutoff = 1.0) {
    Object.assign(this, { minCutoff, beta, dCutoff, x: null, dx: 0, t: null });
  }
  alpha(cutoff, dt) { const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
  filter(v, t) {
    if (this.x === null) { this.x = v; this.t = t; return v; }
    const dt = Math.max((t - this.t) / 1000, 1e-3); this.t = t;
    const dx = (v - this.x) / dt;
    this.dx += this.alpha(this.dCutoff, dt) * (dx - this.dx);
    const cutoff = minCutoffUI + this.beta * Math.abs(this.dx);
    this.x += this.alpha(cutoff, dt) * (v - this.x);
    return this.x;
  }
}
// スライダーで調整：値が大きいほど反応が速く、小さいほどなめらか
let minCutoffUI = 7;
const slider = document.getElementById("smooth");
slider.oninput = () => { minCutoffUI = +slider.value; document.getElementById("smoothVal").textContent = slider.value; };
let filters = null;
const resetFilters = () => filters = Array.from({ length: 33 }, () => ({ x: new OneEuro(), y: new OneEuro() }));
function smooth(lm, t) {
  if (!filters) resetFilters();
  return lm.map((p, i) => ({ x: filters[i].x.filter(p.x, t), y: filters[i].y.filter(p.y, t), visibility: p.visibility }));
}

let landmarker, stream, facing = "user", lastTime = -1, running = false;

async function loadModel() {
  status.textContent = "AIモデル読み込み中…";
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = d => ({
    baseOptions: {
      // ① Lite → Full モデル
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
      delegate: d
    },
    runningMode: "VIDEO",
    numPoses: 1,
    minPoseDetectionConfidence: CONF,
    minPosePresenceConfidence: CONF,
    minTrackingConfidence: CONF
  });
  try { landmarker = await PoseLandmarker.createFromOptions(vision, opts("GPU")); }
  catch { landmarker = await PoseLandmarker.createFromOptions(vision, opts("CPU")); }
}

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: 640, height: 480 }, audio: false });  // ⑤ 640×480
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const m = facing === "user";
  video.classList.toggle("mirror", m);
  canvas.classList.toggle("mirror", m);
}

// ===== 描画 =====
const px = p => ({ x: p.x * canvas.width, y: p.y * canvas.height });
const ok = p => (p.visibility ?? 1) >= VIS;

function line(a, b, color, w) {
  ctx.strokeStyle = color; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
}
function dot(p, color, r) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
}

// ④ 左右の腕のうち、よく見えている方を選ぶ
function pickArm(lm) {
  const score = ids => ids.reduce((s, i) => s + (lm[i].visibility ?? 0), 0) / ids.length;
  const l = score(LEFT_ARM), r = score(RIGHT_ARM);
  const best = l >= r ? { ids: LEFT_ARM, name: "左", s: l } : { ids: RIGHT_ARM, name: "右", s: r };
  return best.s >= VIS ? best : null;
}

function drawPose(lm) {
  // 見えている点同士だけ線で結ぶ
  for (const c of BODY) {
    if (ok(lm[c.start]) && ok(lm[c.end])) line(px(lm[c.start]), px(lm[c.end]), "#00e5ff", 4);
  }
  for (let i = 11; i < 33; i++) if (ok(lm[i])) dot(px(lm[i]), "#ff3d71", 4);

  // カウントに使う腕を緑で強調
  const arm = pickArm(lm);
  if (arm) {
    const [s, e, w] = arm.ids.map(i => px(lm[i]));
    line(s, e, "#00e676", 7); line(e, w, "#00e676", 7);
  }
  if (arm) {
    const [s, e, w] = arm.ids.map(i => px(lm[i]));
    updateCount(angleAt(s, e, w), isHorizontal(lm));
  }
  const neck = drawNeck(lm);
  info.textContent = `首の角度: ${neck ?? "--"}${neck != null ? "°" : ""} ／ 使用する腕: ${arm ? arm.name : "見えていません"}`;
}

const mid = (a, b) => ({ x: (a.x + b.x) / 2 * canvas.width, y: (a.y + b.y) / 2 * canvas.height });
function drawNeck(lm) {
  const need = [7, 8, 11, 12, 23, 24];
  // 耳・肩・腰は左右どちらか見えていればOK
  if (!(ok(lm[7]) || ok(lm[8])) || !(ok(lm[11]) || ok(lm[12])) || !(ok(lm[23]) || ok(lm[24]))) return null;
  const sh = mid(lm[11], lm[12]), hip = mid(lm[23], lm[24]), head = mid(lm[7], lm[8]);
  line(sh, head, "#ffd600", 5); dot(head, "#ffd600", 7);
  const a1 = Math.atan2(sh.y - hip.y, sh.x - hip.x);
  const a2 = Math.atan2(head.y - sh.y, head.x - sh.x);
  let deg = Math.abs((a2 - a1) * 180 / Math.PI);
  if (deg > 180) deg = 360 - deg;
  return deg.toFixed(0);
}

// ===== 回数カウント =====
const DOWN = 90, UP = 160;   // 肘の角度のしきい値
const HOLD = 2;              // 何フレーム続いたら状態を確定するか（ブレ対策）
const MIN_GAP = 400;         // 1回の最短時間(ms)。速すぎる誤カウントを防ぐ
let count = 0, stage = null, holdDown = 0, holdUp = 0, lastRep = 0;
const countEl = document.getElementById("count");
const detailEl = document.getElementById("detail");

// 3点 a-b-c の b での角度
function angleAt(a, b, c) {
  const r = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
  let d = Math.abs(r * 180 / Math.PI);
  return d > 180 ? 360 - d : d;
}

// 体（腰→肩）が水平に近いか。立ったまま腕を曲げても数えない
function isHorizontal(lm) {
  if (!(ok(lm[11]) || ok(lm[12])) || !(ok(lm[23]) || ok(lm[24]))) return false;
  const sh = mid(lm[11], lm[12]), hip = mid(lm[23], lm[24]);
  let a = Math.abs(Math.atan2(sh.y - hip.y, sh.x - hip.x) * 180 / Math.PI);
  return Math.min(a, 180 - a) < 40;
}

function updateCount(angle, horiz) {
  holdDown = angle <= DOWN ? holdDown + 1 : 0;
  holdUp = angle >= UP ? holdUp + 1 : 0;

  if (holdUp >= HOLD) {
    if (stage === "down" && performance.now() - lastRep > MIN_GAP) {
      count++; lastRep = performance.now();
      countEl.textContent = count;
      kick(countEl, "pop"); kick(document.querySelector(".count-badge"), "burst");
      speak(count);
    }
    stage = "up";
  } else if (holdDown >= HOLD && stage === "up" && horiz) {
    stage = "down";
  }
  // 深さゲージ：160°で0、90°で満タン
  const depth = Math.min(1, Math.max(0, (UP - angle) / (UP - DOWN)));
  document.documentElement.style.setProperty("--depth", depth.toFixed(3));
  const gauge = document.querySelector(".gauge");
  if (depth >= 1 && !gauge.classList.contains("full")) kick(gauge, "full");
  if (depth < 1) gauge.classList.remove("full");
  detailEl.dataset.stage = stage ?? "";
  detailEl.textContent = `肘: ${angle.toFixed(0)}° ／ 状態: ${stage === "down" ? "下" : stage === "up" ? "上" : "待機"} ／ 体: ${horiz ? "水平 ✅" : "水平でない"}`;
}

// アニメーション用クラスを付け直して毎回再生させる
function kick(el, cls) {
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
}

function speak(n) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(n));
  u.lang = "ja-JP";
  speechSynthesis.speak(u);
}

document.getElementById("reset").onclick = () => {
  count = 0; stage = null; countEl.textContent = 0;
};

function loop() {
  if (video.currentTime !== lastTime) {
    lastTime = video.currentTime;
    const t = performance.now();
    const result = landmarker.detectForVideo(video, t);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (result.landmarks.length) {
      drawPose(smooth(result.landmarks[0], t));
      status.textContent = "認識中"; status.classList.add("live");
    } else {
      filters = null;   // 見失ったらフィルターをリセット
      status.textContent = "人が映っていません"; status.classList.remove("live");
      info.textContent = "首の角度: -- ／ 使用する腕: --";
    }
  }
  requestAnimationFrame(loop);
}

document.getElementById("start").onclick = async () => {
  try {
    if (!navigator.mediaDevices) throw new Error("カメラが使えない環境です（https か localhost で開いてください）");
    status.textContent = "カメラ起動中…";
    await startCamera();
    document.querySelector(".placeholder")?.remove();
    if (!landmarker) await loadModel();
    if (!running) { running = true; loop(); }
  } catch (e) {
    status.textContent = "エラー: " + e.message;
  }
};

document.getElementById("flip").onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  if (stream) { filters = null; await startCamera(); }
};
</script>
</body>
</html>
